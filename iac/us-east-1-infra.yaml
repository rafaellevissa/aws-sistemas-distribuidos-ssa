AWSTemplateFormatVersion: 2010-09-09
Description: >
  Infraestrutura completa para a palestra "Engenharia do Caos e Escalabilidade" (Prof. Msc. Rafael Levi).
  Inclui VPC, ALB, ASG, RDS, ECR, S3, Secrets Manager, WAF e Route53. 
  [Referência Teórica: Tanenbaum, Andrew S. - Sistemas Distribuídos 2.ed.]

Parameters:
  LatestUbuntuAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id'
    Description: Busca automatica da ultima AMI do Ubuntu 22.04 na regiao atual

  EnvironmentName:
    Type: String
    Default: "caos-demo-unifan"
  DomainName:
    Type: String
    Description: "Seu domínio principal hospedado no Route53 (ex: rafaellevi.com.br)"
    Default: "rafaellevi.com.br"
  SubDomainName:
    Type: String
    Description: "Subdomínio da aplicação"
    Default: "unifan-sistemas-distribuidos"

Resources:
  # ========================================================================
  # 0. Registry para imagem docker
  # a base para o pipe paralelo buildar e colocar a imagem docker antes de criar o ASG com as intâncias.
  # ========================================================================
  AppECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: "unifan-sistemas-distribuidos-cloudformation"
      EmptyOnDelete: true

  # ========================================================================
  # 1. NETWORKING (VPC, Subnets, Internet Gateway)
  # A base física da rede distribuída.
  # ========================================================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value:
            Fn::Sub: ${EnvironmentName}-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
  
  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId:
        Ref: VPC
      InternetGatewayId:
        Ref: InternetGateway

  # Subnets Públicas para o ALB e ASG
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: VPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: ""

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: VPC
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone:
        Fn::Select:
          - 1
          - Fn::GetAZs: ""

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Ref: VPC

  Route:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId:
        Ref: RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId:
        Ref: InternetGateway

  Subnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: PublicSubnet1
      RouteTableId:
        Ref: RouteTable

  Subnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: PublicSubnet2
      RouteTableId:
        Ref: RouteTable

  # ========================================================================
  # 2. SECURITY GROUPS 
  # Regras de comunicação entre os processos distribuídos.
  # ========================================================================
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permite trafego HTTP mundial para o Load Balancer
      VpcId:
        Ref: VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permite trafego do ALB para as instancias EC2 na porta 80
      VpcId:
        Ref: VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0 # Apenas didatico. Em prod, restringir IP!
          # SourceSecurityGroupId:
          #   Ref: ALBSecurityGroup
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0 # Apenas didatico. Em prod, restringir IP!

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permite as EC2 acessarem o MySQL
      VpcId: 
        Ref: VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId:
            Ref: EC2SecurityGroup

  # ========================================================================
  # 3. SECRETS MANAGER & RDS (MySQL)
  # Tolerância a falhas nos dados e segurança de credenciais.
  # ========================================================================
  DBSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name:
        Fn::Sub: "${EnvironmentName}-db-credentials"
      Description: "Credenciais do MySQL geradas dinamicamente"
      GenerateSecretString:
        SecretStringTemplate: '{"username": "admin"}'
        GenerateStringKey: "password"
        PasswordLength: 16
        ExcludeCharacters: '"@/\'

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets para o banco de dados
      SubnetIds: 
        - Ref: PublicSubnet1
        - Ref: PublicSubnet2

  DBInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BackupRetentionPeriod: 3
      AllocatedStorage: 20
      AutoMinorVersionUpgrade: true
      DBInstanceClass: db.t3.micro
      Engine: mysql
      MasterUsername:
        Fn::Sub: '{{resolve:secretsmanager:${DBSecret}:SecretString:username}}'
      MasterUserPassword:
        Fn::Sub: '{{resolve:secretsmanager:${DBSecret}:SecretString:password}}'
      DBSubnetGroupName: 
        Ref: DBSubnetGroup
      VPCSecurityGroups: 
        - Ref: RDSSecurityGroup
      MultiAZ: false # Colocar true para replicar e garantir HA (Tolerancia a falhas do BD)
      PubliclyAccessible: true # Didático para a aula[cite: 35]

  # ========================================================================
  # 4. S3
  # Repositório de Imagens e Armazenamento de Objetos Imutáveis.
  # ========================================================================
  AppS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: "aula-pratica-imagens-${AWS::AccountId}" #[cite: 35]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  BucketCleanupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: EmptyAppBucket
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                Resource:
                  Fn::GetAtt: AppS3Bucket.Arn
              - Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                Resource:
                  Fn::Sub: '${AppS3Bucket.Arn}/*'

  BucketCleanupFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      Timeout: 900
      Role:
        Fn::GetAtt: BucketCleanupRole.Arn
      Code:
        ZipFile: |
          const https = require('node:https');
          const {
            S3Client, ListObjectVersionsCommand, ListObjectsV2Command, DeleteObjectsCommand,
          } = require('@aws-sdk/client-s3');
          const s3 = new S3Client({});

          async function deleteBatch(bucket, objects, context) {
            if (context.getRemainingTimeInMillis() < 30000) {
              throw new Error('Cleanup time limit reached; retry stack deletion');
            }
            const result = await s3.send(new DeleteObjectsCommand({
              Bucket: bucket, Delete: { Objects: objects, Quiet: true },
            }));
            if (result.Errors?.length) {
              throw new Error('S3 deletion failed: ' + result.Errors.map(error => error.Code).join(', '));
            }
          }

          async function emptyBucket(bucket, context) {
            while (true) {
              const page = await s3.send(new ListObjectVersionsCommand({ Bucket: bucket, MaxKeys: 1000 }));
              const objects = [...(page.Versions || []), ...(page.DeleteMarkers || [])]
                .map(object => ({ Key: object.Key, VersionId: object.VersionId }));
              if (!objects.length) break;
              await deleteBatch(bucket, objects, context);
            }
            while (true) {
              const page = await s3.send(new ListObjectsV2Command({ Bucket: bucket, MaxKeys: 1000 }));
              const objects = (page.Contents || []).map(object => ({ Key: object.Key }));
              if (!objects.length) break;
              await deleteBatch(bucket, objects, context);
            }
          }

          function respond(event, context, status, reason) {
            const body = JSON.stringify({
              Status: status,
              Reason: reason || 'Bucket cleanup completed',
              PhysicalResourceId: event.PhysicalResourceId || 'cleanup-' + event.ResourceProperties.BucketName,
              StackId: event.StackId,
              RequestId: event.RequestId,
              LogicalResourceId: event.LogicalResourceId,
              Data: {},
            });
            return new Promise((resolve, reject) => {
              const request = https.request(event.ResponseURL, {
                method: 'PUT',
                headers: { 'content-type': '', 'content-length': Buffer.byteLength(body) },
              }, response => {
                response.resume();
                response.on('end', () => {
                  if (response.statusCode >= 200 && response.statusCode < 300) resolve();
                  else reject(new Error('CloudFormation response failed: ' + response.statusCode));
                });
              });
              request.on('error', reject);
              request.setTimeout(Math.min(10000, context.getRemainingTimeInMillis() - 1000), () => {
                request.destroy(new Error('CloudFormation response timed out'));
              });
              request.end(body);
            });
          }

          exports.handler = async (event, context) => {
            let status = 'SUCCESS';
            let reason;
            try {
              if (event.RequestType === 'Delete') {
                await emptyBucket(event.ResourceProperties.BucketName, context);
              }
            } catch (error) {
              if (error.name !== 'NoSuchBucket') {
                status = 'FAILED';
                reason = String(error.message).slice(0, 1000);
                console.error('Bucket cleanup failed:', reason);
              }
            }
            await respond(event, context, status, reason);
          };

  AppBucketCleanup:
    Type: Custom::EmptyS3Bucket
    Properties:
      ServiceToken:
        Fn::GetAtt: BucketCleanupFunction.Arn
      ServiceTimeout: 1000
      BucketName:
        Ref: AppS3Bucket

  # ========================================================================
  # 5. IAM ROLES & POLICIES
  # Dando autonomia à máquina para ler segredos e imagens sem senhas hardcoded.
  # ========================================================================
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /unifan/caos-demo-api
      RetentionInDays: 1
  
  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: [ ec2.amazonaws.com ] }
            Action: [ sts:AssumeRole ]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly #[cite: 35]
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: ReadSecrets
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  Ref: DBSecret

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: 
        - Ref: EC2InstanceRole

  # ========================================================================
  # 6. LOAD BALANCER & TARGET GROUP
  # [Tanenbaum]: Transparência de Falha e Roteamento
  # ========================================================================
  AppTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 80
      Protocol: HTTP
      VpcId:
        Ref: VPC
      HealthCheckIntervalSeconds: 10 # Heath Check Rigoroso para Engenharia do Caos
      HealthCheckPath: "/"
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2

  AppLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Subnets: 
        - Ref: PublicSubnet1
        - Ref: PublicSubnet2
      SecurityGroups: 
        - Ref: ALBSecurityGroup
      Type: application

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn:
        Ref: AppLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn:
            Ref: AppTargetGroup

  # ========================================================================
  # 7. WAF (Web Application Firewall)
  # Injetando segurança na camada de aplicação distribuída.
  # ========================================================================
  WebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: AppWebACL
      Rules:
        - Name: AWS-AWSManagedRulesCommonRuleSet
          Priority: 1
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              RuleActionOverrides:
                - Name: SizeRestrictions_BODY
                  ActionToUse:
                    Count: {}
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWSManagedRulesCommonRuleSetMetric
        - Name: BlockOversizedBodyOutsideUpload
          Priority: 2
          Action:
            Block: {}
          Statement:
            AndStatement:
              Statements:
                - LabelMatchStatement:
                    Scope: LABEL
                    Key: awswaf:managed:aws:core-rule-set:SizeRestrictions_Body
                - NotStatement:
                    Statement:
                      AndStatement:
                        Statements:
                          - RegexMatchStatement:
                              RegexString: '^/upload/?$'
                              FieldToMatch:
                                UriPath: {}
                              TextTransformations:
                                - Priority: 0
                                  Type: NONE
                          - ByteMatchStatement:
                              SearchString: POST
                              PositionalConstraint: EXACTLY
                              FieldToMatch:
                                Method: {}
                              TextTransformations:
                                - Priority: 0
                                  Type: NONE
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: BlockOversizedBodyOutsideUpload

  WebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn:
        Ref: AppLoadBalancer
      WebACLArn:
        Fn::GetAtt: WebACL.Arn

  # ========================================================================
  # 8. AUTO SCALING GROUP & LAUNCH TEMPLATE (Imutabilidade)
  # Provisionamento ágil onde o servidor nasce, instala tudo e morre sem pena.
  # ========================================================================
  AppLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        InstanceType: t2.micro
        ImageId:
          Ref: LatestUbuntuAmiId
        IamInstanceProfile: 
          Arn:
            Fn::GetAtt: EC2InstanceProfile.Arn
        SecurityGroupIds: 
          - Ref: EC2SecurityGroup
        UserData:
          Fn::Base64:
            Fn::Sub: |
              #!/bin/bash
              # 1. Update e Instalação do Docker e AWS CLI[cite: 35]
              apt-get update -y
              apt-get install docker.io awscli jq -y
              usermod -aG docker ubuntu
              systemctl enable docker
              systemctl start docker
              
              # 2. Pegar as credenciais do DB no Secrets Manager
              SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id ${DBSecret} --region ${AWS::Region} --query SecretString --output text)
              DB_USER=$(echo $SECRET_JSON | jq -r .username)
              DB_PASS=$(echo $SECRET_JSON | jq -r .password)
              DB_HOST=${DBInstance.Endpoint.Address}
              
              # 3. Login no ECR e Pull da imagem
              aws ecr get-login-password --region ${AWS::Region} | docker login --username AWS --password-stdin ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
              IMAGE_URI="${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/unifan-sistemas-distribuidos-cloudformation:latest"
              
              docker pull $IMAGE_URI || true
              
              # 4. ID da instancia (IMDSv2) para log stream dedicado por instancia
              IMDS_TOKEN=$(curl -s -X PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
              INSTANCE_ID=$(curl -s -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
              INSTANCE_ID=$(echo "$INSTANCE_ID" | grep -E '^i-[0-9a-f]+$' || hostname)
              
              # 5. Iniciar Container injetando os Segredos
              docker run -d -p 80:3000 \
                -e DB_HOST=$DB_HOST \
                -e DB_USER=$DB_USER \
                -e DB_PASSWORD="$DB_PASS" \
                -e DB_NAME=aula_pratica_db \
                -e AWS_REGION=${AWS::Region} \
                -e AWS_S3_REGION=${AWS::Region} \
                -e AWS_S3_BUCKET_NAME=aula-pratica-imagens-${AWS::AccountId} \
                -e INSTANCE_ID=$INSTANCE_ID \
                --log-driver=awslogs \
                --log-opt awslogs-region=${AWS::Region} \
                --log-opt awslogs-group=/unifan/caos-demo-api \
                --log-opt awslogs-stream=$INSTANCE_ID \
              --name unifan-api $IMAGE_URI

  AppAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: AppBucketCleanup
    Properties:
      VPCZoneIdentifier: 
        - Ref: PublicSubnet1
        - Ref: PublicSubnet2
      LaunchTemplate:
        LaunchTemplateId:
          Ref: AppLaunchTemplate
        Version:
          Fn::GetAtt: AppLaunchTemplate.LatestVersionNumber
      MinSize: '2' # Conceito Tanenbaum: Redundância mínima de hardware
      MaxSize: '5'
      TargetGroupARNs: 
        - Ref: AppTargetGroup

  # ========================================================================
  # 9. ROUTE 53 (DNS e Transparência de Localização)
  # ========================================================================
  AppDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName:
        Fn::Sub: "${DomainName}."
      Name: 
        Fn::Sub: "${SubDomainName}.${DomainName}."
      Type: A
      SetIdentifier: "us-east-1-region" # Latency Routing[cite: 33, 34]
      Region: "us-east-1"
      AliasTarget:
        HostedZoneId: 
          Fn::GetAtt: AppLoadBalancer.CanonicalHostedZoneID
        DNSName: 
          Fn::GetAtt: AppLoadBalancer.DNSName
        EvaluateTargetHealth: true

Outputs:
  LoadBalancerDNS:
    Description: O DNS público do seu ALB
    Value:
      Fn::GetAtt: AppLoadBalancer.DNSName
  S3BucketArn:
    Description: Bucket S3 para upload das imagens
    Value:
      Fn::GetAtt: AppS3Bucket.Arn
  DBHost:
    Description: Endpoint do RDS criado na região us-east-1
    Value:
      Fn::GetAtt: DBInstance.Endpoint.Address
  DBSecretName:
    Description: Nome do secret do banco criado na região us-east-1
    Value:
      Ref: DBSecret
    Export:
      Name:
        Fn::Sub: "${EnvironmentName}-db-secret-name"
  DBSecretArn:
    Description: ARN do secret do banco criado na região us-east-1
    Value:
      Ref: DBSecret
    Export:
      Name:
        Fn::Sub: "${EnvironmentName}-db-secret-arn"
  Route53Domain:
    Description: Dominio final acessível pelo usuario
    Value:
      Fn::Sub: "${SubDomainName}.${DomainName}"
  LoadBalancerFullName:
    Description: Nome completo do ALB (dimensao LoadBalancer no CloudWatch)
    Value:
      Fn::GetAtt: AppLoadBalancer.LoadBalancerFullName
  TargetGroupFullName:
    Description: Nome completo do Target Group (dimensao TargetGroup no CloudWatch)
    Value:
      Fn::GetAtt: AppTargetGroup.TargetGroupFullName
  AutoScalingGroupName:
    Description: Nome do ASG que registra as instancias no Target Group
    Value:
      Ref: AppAutoScalingGroup
  AppLogGroupName:
    Description: Log group da API (um log stream por instancia)
    Value:
      Ref: AppLogGroup