AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Infraestrutura completa para a palestra "Engenharia do Caos e Escalabilidade" (Prof. Msc. Rafael Levi).
  Inclui VPC, ALB, ASG, RDS, ECR, S3, Secrets Manager, WAF e Route53. 
  [Referência Teórica: Tanenbaum, Andrew S. - Sistemas Distribuídos 2.ed.]

Parameters:
  LatestUbuntuAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id'
    Description: Busca automatica da ultima AMI do Ubuntu 22.04 na regiao atual
  EnvironmentName:
    Type: String
    Default: caos-demo-unifan
  DomainName:
    Type: String
    Default: rafaellevi.com.br
  SubDomainName:
    Type: String
    Default: unifan-sistemas-distribuidos2

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone:
        Fn::Select: [ 0, !GetAZs '' ]

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone:
        Fn::Select: [ 1, !GetAZs '' ]

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  Route:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  Subnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref RouteTable

  Subnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref RouteTable

  # SECURITY GROUPS
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permite trafego HTTP mundial para o Load Balancer
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permite trafego do ALB para as instancias EC2 na porta 80
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSecurityGroup
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permite as EC2 acessarem o MySQL
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref EC2SecurityGroup

  # SECRETS MANAGER & RDS
  DBSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub "${EnvironmentName}-db-credentials"
      Description: "Credenciais do MySQL geradas dinamicamente"
      GenerateSecretString:
        SecretStringTemplate: '{"username": "admin"}'
        GenerateStringKey: "password"
        PasswordLength: 16
        ExcludeCharacters: '"@/\\'

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets para o banco de dados
      SubnetIds:
        - Ref: PublicSubnet1
        - Ref: PublicSubnet2

  DBInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BackupRetentionPeriod: 3
      AllocatedStorage: 20
      AutoMinorVersionUpgrade: true
      DBInstanceClass: db.t3.micro
      Engine: mysql
      MasterUsername: !Sub '{{resolve:secretsmanager:${DBSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DBSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - Ref: RDSSecurityGroup
      MultiAZ: false
      PubliclyAccessible: true

  # ECR & S3
  AppECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: "unifan-sistemas-distribuidos-cloudformation"

  ECRReplication:
    Type: AWS::ECR::ReplicationConfiguration
    Properties:
      ReplicationConfiguration:
        rules:
          - destinations:
              - region: eu-central-1
            repositoryFilters:
              - filter: '*'
                filterType: PREFIX_MATCH

  AppS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "aula-pratica-imagens-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  # LOAD BALANCER & TARGET GROUP
  AppTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 80
      Protocol: HTTP
      VpcId: !Ref VPC
      HealthCheckIntervalSeconds: 10
      HealthCheckPath: "/"
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2

  AppLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Subnets:
        - Ref: PublicSubnet1
        - Ref: PublicSubnet2
      SecurityGroups:
        - Ref: ALBSecurityGroup
      Type: application

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn:
        Ref: AppLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn:
            Ref: AppTargetGroup

  # WAF
  WebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: AppWebACL
      Rules:
        - Name: AWS-AWSManagedRulesCommonRuleSet
          Priority: 1
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWSManagedRulesCommonRuleSetMetric

  WebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn:
        Ref: AppLoadBalancer
      WebACLArn:
        Fn::GetAtt: WebACL.Arn

  # IAM ROLES & POLICIES
  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: [ ec2.amazonaws.com ] }
            Action: [ sts:AssumeRole ]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
      Policies:
        - PolicyName: ReadSecrets
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  Ref: DBSecret

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - Ref: EC2InstanceRole

  # AUTO SCALING GROUP & LAUNCH TEMPLATE
  AppLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        InstanceType: t2.micro
        ImageId:
          Ref: LatestUbuntuAmiId
        IamInstanceProfile: 
          Arn:
            Fn::GetAtt: EC2InstanceProfile.Arn
        SecurityGroupIds: 
          - Ref: EC2SecurityGroup
        UserData:
          Fn::Base64:
            Fn::Sub: |
              #!/bin/bash
              apt-get update -y
              apt-get install docker.io awscli jq -y
              usermod -aG docker ubuntu
              systemctl enable docker
              systemctl start docker
              
              # 2. Pegar as credenciais do DB no Secrets Manager
              SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id ${DBSecret} --region ${AWS::Region} --query SecretString --output text)
              DB_USER=$(echo $SECRET_JSON | jq -r .username)
              DB_PASS=$(echo $SECRET_JSON | jq -r .password)
              DB_HOST=${DBInstance.Endpoint.Address}
              
              # 3. Login no ECR e Pull da imagem
              aws ecr get-login-password --region ${AWS::Region} | docker login --username AWS --password-stdin ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
              IMAGE_URI="${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/unifan-sistemas-distribuidos-cloudformation:latest"
              
              docker pull $IMAGE_URI || true
              
              # 4. Iniciar Container injetando os Segredos
              docker run -d -p 80:3000 \
                -e DB_HOST=$DB_HOST \
                -e DB_USER=$DB_USER \
                -e DB_PASS=$DB_PASS \
                -e DB_NAME=aula_pratica_db \
                -e AWS_REGION=${AWS::Region} \
                -e AWS_S3_BUCKET_NAME=aula-pratica-imagens-${AWS::AccountId} \
              --name unifan-api $IMAGE_URI

  AppAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier: 
        - Ref: PublicSubnet1
        - Ref: PublicSubnet2
      LaunchTemplate:
        LaunchTemplateId:
          Ref: AppLaunchTemplate
        Version:
          Fn::GetAtt: AppLaunchTemplate.LatestVersionNumber
      MinSize: '2'
      MaxSize: '5'
      TargetGroupARNs: 
        - Ref: AppTargetGroup

  # ROUTE53 record will be created externally (latency-based) after both regional stacks are deployed

Outputs:
  LoadBalancerDNS:
    Description: O DNS público do seu ALB
    Value:
      Fn::GetAtt: AppLoadBalancer.DNSName
  S3BucketArn:
    Description: Bucket S3 para upload das imagens
    Value:
      Fn::GetAtt: AppS3Bucket.Arn
  Route53Domain:
    Description: Dominio final acessível pelo usuario
    Value:
      Fn::Sub: "${SubDomainName}.${DomainName}"
