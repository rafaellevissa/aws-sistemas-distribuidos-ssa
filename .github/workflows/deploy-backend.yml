name: Deploy Backend API

on:
  workflow_call:
    inputs:
      refresh-instances:
        type: boolean
        default: true
      wait-for-ecr:
        description: "Aguarda ~20s para a consistencia do ECR recem-criado pelo Terraform (usado no Deploy Infrastructure)."
        type: boolean
        default: false
  push:
    branches: [ "main" ]

jobs:
  build-and-image-push:
    runs-on: ubuntu-latest

    steps:
      # So aguarda quando o ECR acabou de ser criado pelo Terraform (Deploy Infrastructure).
      # No fluxo de push direto o ECR ja existe, entao nao ha espera.
      - name: Wait for ECR availability
        if: ${{ inputs.wait-for-ecr }}
        run: sleep 20

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR (SemVer) 
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.actor }}-v1.0.${{ github.run_number }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  refresh-instances:
    needs: build-and-image-push
    if: ${{ github.event_name == 'push' || inputs.refresh-instances }}
    runs-on: ubuntu-latest
    env:
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_STATE_KEY: aws-sistemas-distribuidos-ssa/terraform.tfstate
      TF_STATE_REGION: us-east-1
    strategy:
      fail-fast: false
      matrix:
        region: [us-east-1, eu-central-1]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ matrix.region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Start rolling instance refresh
        run: bash iac/scripts/refresh-instances.sh "${{ matrix.region }}"