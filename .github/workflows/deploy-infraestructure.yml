name: Deploy Infrastructure
on:
  workflow_dispatch:

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    env:
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_STATE_KEY: aws-sistemas-distribuidos-ssa/terraform.tfstate
      TF_STATE_REGION: us-east-1
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # As credenciais (uma unica conta) servem para as duas regioes; o provider
      # do Terraform seleciona a regiao por alias (us-east-1 e eu-central-1).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform apply (multi-regiao + dashboard + Route53)
        run: |
          chmod +x iac/scripts/apply.sh
          ./iac/scripts/apply.sh

  build-and-push-docker-image:
    uses: rafaellevissa/aws-sistemas-distribuidos-ssa/.github/workflows/deploy-backend.yml@main
    with:
      refresh-instances: false
    secrets: inherit
