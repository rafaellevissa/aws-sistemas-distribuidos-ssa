name: Deploy Infrastructure
on:
  workflow_dispatch:

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials for us-east-1
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy us-east-1 stack
        run: |
          chmod +x iac/scripts/create-stack.sh
          ./iac/scripts/create-stack.sh us-east-1

      - name: Configure AWS credentials for eu-central-1
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Deploy eu-central-1 stack
        run: |
          chmod +x iac/scripts/create-stack.sh
          ./iac/scripts/create-stack.sh eu-central-1

      - name: Update Route53 latency records
        if: ${{ secrets.HOSTED_ZONE_NAME != '' }}
        env:
          HOSTED_ZONE_NAME: ${{ secrets.HOSTED_ZONE_NAME }}
        run: |
          chmod +x iac/scripts/update-route53.sh
          ./iac/scripts/update-route53.sh "$HOSTED_ZONE_NAME"
